name: profile Workflow

on:
  push:
    branches:
      - origin

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4"

      #build docker image
      - name: Build and push
        id: docker_build
        run: |
          docker build -t oluwaseun7/profile:1.0.1 .

      #This is for docker login
      - name: "Login to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

        #This is for docker push
      - name: Build and push Docker image
        uses: docker/build-push-action@v6.6.0
        with:
          context: .
          push: true
          tags: oluwaseun7/profile:1.0.1
        #run: |
         # docker push oluwaseun7/profile:1.0.1
      - name: "Run docker container"
        run: |
          docker run -d -p 8080:80 oluwaseun7/profile:1.0.1

         #litting docker image
      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile


        #This is jaeger monitoring an troubleshoot
      - name: "run jarger on docker"
        run: |
            docker run -d --name jaeger \
            -p "6831:6831/udp" -p "16686:16686" \
            --restart unless-stopped jaegertracing/all-in-one:latest
            docker buildx create --use \
            --name myjaeger \
            --driver docker-container \
            --driver-opt "network=host" \
            --driver-opt "env.JAEGER_TRACE=localhost:6831" \
            --driver-opt "env.JAEGER_SERVICE_NAME=profile" 
            docker buildx inspect myjaeger
            docker --debug buildx inspect myjaeger

      

